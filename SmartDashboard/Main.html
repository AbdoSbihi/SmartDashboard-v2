<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartDash</title>
    <link rel="icon" href="data:,">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── APP SHELL ── */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 200px;
            background: #1a1a2e;
            border-right: 1px solid rgba(255,255,255,0.07);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .sidebar-brand {
            padding: 0 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            margin-bottom: 1rem;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #e94560;
            letter-spacing: 1px;
        }

        .brand-sub {
            font-size: 0.72rem;
            color: #606080;
            margin-top: 0.2rem;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0 0.75rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #808090;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: left;
            width: 100%;
        }

            .nav-btn:hover {
                background: rgba(255,255,255,0.06);
                color: #e0e0e0;
            }

        .nav-active {
            background: rgba(233,69,96,0.15) !important;
            color: #e94560 !important;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.1rem;
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            margin-left: 200px;
            flex: 1;
            padding: 2rem;
            min-height: 100vh;
        }

        /* ── WIDGET CARD ── */
        .widget-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.02);
        }

        .widget-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .widget-icon {
            font-size: 1.2rem;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #a0a0b0;
            padding: 0.35rem 0.75rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn-refresh:hover {
                background: rgba(233,69,96,0.2);
                color: #e94560;
            }

        .widget-body {
            padding: 1.25rem;
        }

        /* ── WIDGET STATES ── */
        .widget-loading {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
            color: #808090;
        }

        .widget-idle {
            padding: 2rem;
            color: #606070;
            text-align: center;
        }

        .widget-error {
            padding: 1rem;
            color: #ff6080;
            background: rgba(255,56,96,0.1);
            border-radius: 8px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── WEATHER ── */
        .search-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .search-input {
            flex: 1;
            padding: 0.65rem 1rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }

            .search-input:focus {
                border-color: #e94560;
            }

            .search-input::placeholder {
                color: #505070;
            }

        .btn-search {
            padding: 0.65rem 1.25rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }

            .btn-search:hover {
                opacity: 0.85;
            }

        .weather-top {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .weather-icon-img {
            width: 80px;
            height: 80px;
        }

        .weather-temp {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }

        .weather-city {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-top: 0.25rem;
        }

        .weather-desc {
            font-size: 0.85rem;
            color: #606080;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .weather-detail {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            font-size: 0.72rem;
            color: #606080;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .forecast-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .forecast-day {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 0.75rem;
            text-align: center;
        }

        .forecast-date {
            font-size: 0.75rem;
            color: #606080;
            margin-bottom: 0.35rem;
        }

        .forecast-icon {
            width: 40px;
            height: 40px;
        }

        .forecast-temps {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .temp-max {
            color: #f5a623;
            font-weight: 700;
        }

        .temp-min {
            color: #6080a0;
        }

        /* ── NEWS ── */
        .news-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .tab-btn {
            padding: 0.4rem 0.85rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #808090;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

            .tab-btn:hover {
                background: rgba(233,69,96,0.15);
                color: #e94560;
                border-color: #e94560;
            }

        .tab-active {
            background: rgba(233,69,96,0.2) !important;
            color: #e94560 !important;
            border-color: #e94560 !important;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .news-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.15s;
            display: flex;
            flex-direction: column;
        }

            .news-card:hover {
                border-color: #e94560;
                transform: translateY(-2px);
            }

        .news-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .news-content {
            padding: 0.85rem;
            flex: 1;
        }

        .news-source {
            font-size: 0.72rem;
            color: #e94560;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        .news-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
            line-height: 1.4;
            margin-bottom: 0.4rem;
        }

        .news-desc {
            font-size: 0.8rem;
            color: #606080;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── CURRENCY ── */
        .currency-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

            .form-field label {
                font-size: 0.75rem;
                color: #606080;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 700;
            }

        .form-select, .form-input {
            padding: 0.65rem 1rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }

            .form-select option {
                background: #1a1a2e;
            }

            .form-select:focus, .form-input:focus {
                border-color: #e94560;
            }

        .currency-updated {
            font-size: 0.75rem;
            color: #606080;
            margin-bottom: 0.75rem;
        }

        .rates-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

            .rates-table th {
                text-align: left;
                padding: 0.5rem 0.75rem;
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #606080;
                border-bottom: 1px solid rgba(255,255,255,0.07);
            }

            .rates-table td {
                padding: 0.6rem 0.75rem;
                border-top: 1px solid rgba(255,255,255,0.04);
            }

            .rates-table tr:hover td {
                background: rgba(255,255,255,0.03);
            }

        .rate-val {
            color: #a0a0c0;
            font-family: monospace;
        }

        .rate-converted {
            color: #e94560;
            font-weight: 700;
        }

        /* ── SETTINGS ── */
        .settings-content {
            max-width: 480px;
        }

        .settings-desc {
            color: #606080;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
        }

        .settings-label {
            font-size: 0.85rem;
            color: #808090;
        }

        .settings-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .settings-saved {
            margin-bottom: 1rem;
            padding: 0.65rem 1rem;
            background: rgba(72,199,142,0.15);
            border: 1px solid #48c78e;
            color: #48c78e;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .btn-save {
            padding: 0.75rem 2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }

            .btn-save:hover {
                opacity: 0.85;
            }

        /* ── DARK / LIGHT THEME ── */
        :root {
            --bg: #0f1117;
            --bg2: #1a1a2e;
            --border: rgba(255,255,255,0.07);
            --text: #e0e0e0;
            --text-sub: #808090;
            --card-bg: rgba(255,255,255,0.04);
            --input-bg: rgba(255,255,255,0.07);
            --accent: #e94560;
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg2: #ffffff;
            --border: rgba(0,0,0,0.08);
            --text: #1a1a2e;
            --text-sub: #666680;
            --card-bg: rgba(0,0,0,0.02);
            --input-bg: rgba(0,0,0,0.05);
            --accent: #e94560;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .sidebar {
            background: var(--bg2);
            border-right: 1px solid var(--border);
        }

        .widget-card {
            background: var(--card-bg);
            border-color: var(--border);
        }

        .widget-header {
            background: var(--card-bg);
            border-color: var(--border);
        }

        .nav-btn {
            color: var(--text-sub);
        }

            .nav-btn:hover {
                color: var(--text);
            }

        .brand-sub {
            color: var(--text-sub);
        }

        .form-select, .form-input, .search-input {
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--border);
        }

        .weather-detail {
            background: var(--card-bg);
        }

        .forecast-day {
            background: var(--card-bg);
        }

        .stat-card {
            background: var(--card-bg);
        }

        .settings-row {
            background: var(--card-bg);
        }

        /* ── CLOCK ── */
        .clock-widget {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }

        .clock-time {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 0.1rem;
        }

        /* ── SIDEBAR FOOTER ── */
        .sidebar-footer {
            margin-top: auto;
            padding: 1rem 0.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* ── THEME TOGGLE ── */
        .btn-theme {
            width: 100%;
            padding: 0.55rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

            .btn-theme:hover {
                background: rgba(233,69,96,0.15);
                color: var(--accent);
            }

        /* ── REFRESH COUNTDOWN ── */
        .refresh-countdown {
            font-size: 0.72rem;
            color: var(--text-sub);
            text-align: center;
            padding: 0.25rem 0;
        }

        /* ── UNIT TOGGLE ── */
        .weather-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

            .weather-controls .search-bar {
                flex: 1;
                margin-bottom: 0;
            }

        .btn-unit {
            padding: 0.55rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

            .btn-unit:hover {
                background: rgba(233,69,96,0.15);
                color: var(--accent);
            }
    </style>
</head>
<body>
    <div id="main"></div>
    <script type="module" src="/SmartDashboard.min.js"></script>
</body>
</html>
